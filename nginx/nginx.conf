events { worker_connections 1024; }

http {
    upstream library_backend {
        least_conn;
        server backend1:3001 max_fails=3 fail_timeout=15s;
        server backend2:3001 max_fails=3 fail_timeout=15s;
        server backend3:3001 max_fails=3 fail_timeout=15s;
    }

    server {
        listen 80;
        location / {
            proxy_pass         http://library_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 3s;
        }
    }
}
