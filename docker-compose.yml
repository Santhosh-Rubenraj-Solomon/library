x-backend: &backend-base
  build: ./backend
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

x-backend-env: &backend-env
  HOST: postgres
  DBPORT: 5432
  DBUSERNAME: postgres
  DBPASS: postgres
  DBNAME: library
  PORT: 3001
  JWT: change-me-to-a-long-random-secret
  CORS_ORIGIN: http://localhost:4200

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend1:
    <<: *backend-base
    environment: { <<: *backend-env, INSTANCE_ID: backend-1 }
  backend2:
    <<: *backend-base
    environment: { <<: *backend-env, INSTANCE_ID: backend-2 }
  backend3:
    <<: *backend-base
    environment: { <<: *backend-env, INSTANCE_ID: backend-3 }

  # One-shot: creates/promotes the admin user, then exits. Without this,
  # /usersignin only ever mints "user" tokens and the admin screens are
  # unreachable. Override ADMIN_EMAIL to seed a different account.
  seed-admin:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment: { <<: *backend-env, ADMIN_EMAIL: admin@surflibrary.dev }
    command: ["node", "dist/src/seed-admin.js"]
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [backend1, backend2, backend3]
    restart: unless-stopped

volumes:
  pgdata:
